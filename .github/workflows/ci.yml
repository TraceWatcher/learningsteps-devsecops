
name: LearningSteps CI Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Python Quality & Tests
    runs-on: ubuntu-24.04
    env:
      CI_DATABASE_URL: postgresql://learningsteps_ci:ci_only_test_password@127.0.0.1:5433/learning_journal

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: learningsteps_ci
          POSTGRES_PASSWORD: ci_only_test_password
          POSTGRES_DB: learning_journal
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U learningsteps_ci -d learning_journal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check api/ tests/

      - name: Initialize PostgreSQL and apply migrations
        env:
          PGPASSWORD: ci_only_test_password
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

          export PGHOST=127.0.0.1
          export PGPORT=5433
          export PGUSER=learningsteps_ci
          export PGDATABASE=learning_journal

          psql -X -v ON_ERROR_STOP=1 -f database_setup.sql
          psql -X -v ON_ERROR_STOP=1 -f migrations/001_add_entry_owner.sql
          psql -X -v ON_ERROR_STOP=1 -f migrations/002_require_owner_for_new_entries.sql

          echo "PASS: CI database schema initialized"

      - name: Pytest including PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: |
          python -m pytest tests/ -v -ra

  security:
    name: Secret & IaC Security
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secret scanning
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.72.0"
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: "1"

      - name: Terraform security scanning
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.72.0"
          scan-type: config
          scan-ref: infra-terraform/
          severity: HIGH,CRITICAL
          exit-code: "1"

  container:
    name: Docker Build & Vulnerability Scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t learningsteps-api:ci .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.72.0"
          scan-type: image
          image-ref: learningsteps-api:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
