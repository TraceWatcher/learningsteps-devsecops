
name: LearningSteps CI Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Python Quality & Tests
    runs-on: ubuntu-24.04
    env:
      CI_DATABASE_URL: postgresql://learningsteps_ci:ci_only_test_password@127.0.0.1:5433/learning_journal

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: learningsteps_ci
          POSTGRES_PASSWORD: ci_only_test_password
          POSTGRES_DB: learning_journal
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U learningsteps_ci -d learning_journal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            requirements-dev.txt

      - name: Test GitHub–Azure identity sync
        run: python scripts/test-sync-github-azure-identity.py -v

      - name: Test environment control
        run: python scripts/test-control-environment.py -v

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check api/ tests/

      - name: Initialize PostgreSQL and apply migrations
        env:
          PGPASSWORD: ci_only_test_password
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

          export PGHOST=127.0.0.1
          export PGPORT=5433
          export PGUSER=learningsteps_ci
          export PGDATABASE=learning_journal

          psql -X -v ON_ERROR_STOP=1 -f database_setup.sql
          psql -X -v ON_ERROR_STOP=1 -f migrations/001_add_entry_owner.sql
          psql -X -v ON_ERROR_STOP=1 -f migrations/002_require_owner_for_new_entries.sql

          echo "PASS: CI database schema initialized"

      - name: Pytest including PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: |
          python -m pytest tests/ -v -ra

  security:
    name: Secret & IaC Security
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Secret scanning
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.72.0"
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: "1"

      - name: Terraform security scanning
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.72.0"
          scan-type: config
          scan-ref: infra-terraform/
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Kubernetes security scanning
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.76.1"
          scan-type: config
          scan-ref: k8s-manifests/
          scanners: misconfig
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.yaml
          exit-code: "1"

  kubernetes-schema:
    name: Kubernetes Schema Validation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install verified Kubeconform
        shell: bash
        run: |
          set -euo pipefail

          KUBECONFORM_VERSION="v0.8.0"
          KUBECONFORM_SHA256="9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"

          curl -fsSL --retry 3 \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            -o /tmp/kubeconform.tar.gz

          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" \
            | sha256sum --check --status

          echo "PASS: Kubeconform SHA-256 verified"

          sudo tar -xzf /tmp/kubeconform.tar.gz \
            -C /usr/local/bin kubeconform

          kubeconform -v

      - name: Validate Kubernetes manifests
        shell: bash
        run: |
          set -euo pipefail

          CRD_CATALOG_COMMIT="784ec895547a36e548e6810b41f27baade3a0890"

          kubeconform \
            -strict \
            -summary \
            -verbose \
            -kubernetes-version 1.36.5 \
            -schema-location default \
            -schema-location 'schemas/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/${CRD_CATALOG_COMMIT}/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            k8s-manifests/

  container:
    name: Docker Build & Vulnerability Scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t learningsteps-api:ci .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.72.0"
          scan-type: image
          image-ref: learningsteps-api:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
