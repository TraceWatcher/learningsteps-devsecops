name: LearningSteps Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: learningsteps-production
  cancel-in-progress: false

jobs:
  release:
    name: Build Scan Push Deploy
    runs-on: ubuntu-24.04
    environment: production

    env:
      CI_DATABASE_URL: postgresql://learningsteps_ci:ci_only_test_password@127.0.0.1:5433/learning_journal

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: learningsteps_ci
          POSTGRES_PASSWORD: ci_only_test_password
          POSTGRES_DB: learning_journal
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U learningsteps_ci -d learning_journal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    permissions:
      contents: read
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid release tag: $TAG"
            exit 1
          fi

          git fetch origin main

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release commit is not on main"
            exit 1
          fi

          echo "Release validated: $TAG"

      - name: Verify successful CI for release commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "Checking CI for commit: $GITHUB_SHA"

          if ! runs=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            --method GET \
            -f head_sha="$GITHUB_SHA" \
            -f event="push" \
            -f branch="main" \
            --jq '.workflow_runs'); then
            echo "::error::Unable to retrieve CI results"
            exit 1
          fi

          success_count=$(jq -e \
            '[.[] | select(.status == "completed" and .conclusion == "success")] | length' \
            <<< "$runs")

          if [[ "$success_count" -lt 1 ]]; then
            echo "::error::No successful main CI run for release commit"
            exit 1
          fi

          echo "PASS: Successful CI run found"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            requirements-dev.txt

      - name: Test GitHub–Azure identity sync
        run: python scripts/test-sync-github-azure-identity.py -v

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check api/ tests/

      - name: Initialize PostgreSQL and apply migrations
        env:
          PGPASSWORD: ci_only_test_password
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

          export PGHOST=127.0.0.1
          export PGPORT=5433
          export PGUSER=learningsteps_ci
          export PGDATABASE=learning_journal

          psql -X -v ON_ERROR_STOP=1 -f database_setup.sql
          psql -X -v ON_ERROR_STOP=1 -f migrations/001_add_entry_owner.sql
          psql -X -v ON_ERROR_STOP=1 -f migrations/002_require_owner_for_new_entries.sql

          echo "PASS: CI database schema initialized"

      - name: Pytest including PostgreSQL integration
        env:
          RUN_DB_INTEGRATION: "1"
        run: python -m pytest tests/ -v -ra

      - name: Scan secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.72.0"
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: "1"

      - name: Scan Terraform
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.72.0"
          scan-type: config
          scan-ref: infra-terraform/
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Scan Kubernetes manifests
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.76.1"
          scan-type: config
          scan-ref: k8s-manifests/
          scanners: misconfig
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.yaml
          exit-code: "1"


      - name: Install verified Kubeconform
        shell: bash
        run: |
          set -euo pipefail

          KUBECONFORM_VERSION="v0.8.0"
          KUBECONFORM_SHA256="9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"

          curl -fsSL --retry 3 \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            -o /tmp/kubeconform.tar.gz

          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" \
            | sha256sum --check --status

          sudo tar -xzf /tmp/kubeconform.tar.gz \
            -C /usr/local/bin kubeconform

          kubeconform -v

      - name: Validate Kubernetes manifests
        shell: bash
        run: |
          set -euo pipefail

          CRD_CATALOG_COMMIT="784ec895547a36e548e6810b41f27baade3a0890"

          kubeconform \
            -strict \
            -summary \
            -verbose \
            -kubernetes-version 1.36.5 \
            -schema-location default \
            -schema-location 'schemas/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/${CRD_CATALOG_COMMIT}/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            k8s-manifests/

      - name: Build Docker image
        env:
          TAG: ${{ github.ref_name }}
        run: |
          docker build \
            --build-arg APP_VERSION="$TAG" \
            -t acrlearningstepsbff17e9a.azurecr.io/learningsteps-api:"$TAG" \
            .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.72.0"
          scan-type: image
          image-ref: acrlearningstepsbff17e9a.azurecr.io/learningsteps-api:${{ github.ref_name }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false

      - name: Azure Login via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Push verified image to ACR
        env:
          TAG: ${{ github.ref_name }}
        run: |
          az acr login --name acrlearningstepsbff17e9a

          docker push \
            acrlearningstepsbff17e9a.azurecr.io/learningsteps-api:"$TAG"

      - name: Deploy to AKS
        if: ${{ vars.ENABLE_AKS_AUTO_DEPLOY == 'true' }}
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          IMAGE="acrlearningstepsbff17e9a.azurecr.io/learningsteps-api:$TAG"

          # Prepare deployment files
          mkdir -p /tmp/learningsteps-release

          cp k8s-manifests/hpa.yaml \
            /tmp/learningsteps-release/hpa.yaml

          cp k8s-manifests/configmap.yaml \
            /tmp/learningsteps-release/configmap.yaml

          # Check that exactly one container image is defined
          IMAGE_COUNT=$(grep -cE '^[[:space:]]*image:' \
            k8s-manifests/deployment.yaml)

          if [[ "$IMAGE_COUNT" != "1" ]]; then
            echo "::error::Expected exactly one container image"
            exit 1
          fi

          # Replace the old image with the tested release image
          sed -E \
            "s|^([[:space:]]*image: ).*|\1${IMAGE}|" \
            k8s-manifests/deployment.yaml \
            > /tmp/learningsteps-release/deployment.yaml

          grep -F "$IMAGE" \
            /tmp/learningsteps-release/deployment.yaml

          # Apply deployment and HPA through Azure Run Command
          az aks command invoke \
            --resource-group rg-learningsteps-devsecops \
            --name aks-learningsteps \
            --file /tmp/learningsteps-release/deployment.yaml \
            --file /tmp/learningsteps-release/hpa.yaml \
            --file /tmp/learningsteps-release/configmap.yaml \
            --command "kubectl apply -f configmap.yaml && kubectl apply -f deployment.yaml -f hpa.yaml && kubectl rollout status deployment/learningsteps-api -n learningsteps --timeout=180s && kubectl get hpa -n learningsteps" \
            -o json > /tmp/deploy-result.json

          jq -r '.logs' /tmp/deploy-result.json

          EXIT_CODE=$(jq -r '.exitCode // "missing"' \
            /tmp/deploy-result.json)

          if [[ "$EXIT_CODE" != "0" ]]; then
            echo "::error::AKS deployment failed: $EXIT_CODE"
            exit 1
          fi


      - name: Image published
        env:
          TAG: ${{ github.ref_name }}
        run: echo "LearningSteps $TAG image published to ACR"
