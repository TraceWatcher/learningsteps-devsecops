name: LearningSteps Environment Control

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Welche Aktion soll ausgeführt werden?"
        required: true
        type: choice
        options:
          - status
          - start
          - stop
      confirm_stop:
        description: "Nur für STOP: zur Bestätigung STOP eingeben"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: learningsteps-production
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify operations environment
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      environment-id: ${{ steps.protection.outputs.environment-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify environment ID, branch and reviewer settings
        id: protection
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ENVIRONMENT_ID: ${{ vars.OPERATIONS_ENVIRONMENT_ID }}
        shell: bash
        run: |
          if [[ ! "$EXPECTED_ENVIRONMENT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Environment Control ist nicht aktiviert. OPERATIONS_ENVIRONMENT_ID fehlt oder ist ungültig."
            exit 1
          fi
          id=$(bash scripts/check-operations-environment.sh "$GITHUB_REPOSITORY" "$EXPECTED_ENVIRONMENT_ID")
          printf 'environment-id=%s\n' "$id" >> "$GITHUB_OUTPUT"

  environment:
    needs: preflight
    name: Environment ${{ inputs.action }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production-operations

    permissions:
      actions: read
      contents: read
      id-token: write

    env:
      RG: rg-learningsteps-devsecops
      AKS: aks-learningsteps
      POSTGRES: ${{ vars.POSTGRES_SERVER_NAME }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      VM: learningsteps-maintenance
      ACTION: ${{ inputs.action }}
      CONFIRM_STOP: ${{ inputs.confirm_stop }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Recheck environment ID, branch and reviewer settings before Azure login
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ENVIRONMENT_ID: ${{ needs.preflight.outputs.environment-id }}
        shell: bash
        run: |
          test -n "$EXPECTED_ENVIRONMENT_ID"
          bash scripts/check-operations-environment.sh "$GITHUB_REPOSITORY" "$EXPECTED_ENVIRONMENT_ID" >/dev/null

      - name: Verify stop confirmation
        if: inputs.action == 'stop'
        shell: bash
        run: |
          if [[ "$CONFIRM_STOP" != "STOP" ]]; then
            echo "::error::Zum Stoppen muss STOP bestätigt werden."
            exit 1
          fi

      - name: Validate application URL before start
        if: inputs.action == 'start'
        shell: bash
        env:
          APP_URL: ${{ vars.OPERATIONS_APP_URL }}
        run: bash scripts/check-operations-health.sh --validate-url

      - name: Azure Login via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Manage Azure environment
        shell: bash
        run: bash scripts/control-environment.sh

      - name: Verify application after start
        if: inputs.action == 'start'
        shell: bash
        env:
          APP_URL: ${{ vars.OPERATIONS_APP_URL }}
        run: bash scripts/check-operations-health.sh
