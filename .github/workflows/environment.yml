name: LearningSteps Environment Control

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Welche Aktion soll ausgeführt werden?"
        required: true
        type: choice
        options:
          - status
          - start
          - stop
      confirm_stop:
        description: "Nur für STOP: zur Bestätigung STOP eingeben"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: learningsteps-production
  cancel-in-progress: false

jobs:
  environment:
    name: Environment ${{ inputs.action }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production

    permissions:
      contents: read
      id-token: write

    env:
      RG: rg-learningsteps-devsecops
      AKS: aks-learningsteps
      POSTGRES: psql-learningsteps-305c3ba6
      VM: learningsteps-maintenance
      ACTION: ${{ inputs.action }}
      CONFIRM_STOP: ${{ inputs.confirm_stop }}

    steps:
      - name: Azure Login via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify stop confirmation
        if: inputs.action == 'stop'
        shell: bash
        run: |
          if [[ "$CONFIRM_STOP" != "STOP" ]]; then
            echo "::error::Zum Stoppen muss STOP bestätigt werden."
            exit 1
          fi

      - name: Manage Azure environment
        shell: bash
        run: |
          set -euo pipefail

          aks_state() {
            az aks show -g "$RG" -n "$AKS" \
              --query powerState.code -o tsv
          }

          pg_state() {
            az postgres flexible-server show \
              -g "$RG" -n "$POSTGRES" \
              --query state -o tsv
          }

          vm_state() {
            az vm get-instance-view \
              --resource-group "$RG" \
              --name "$VM" \
              --query "instanceView.statuses[?starts_with(code, 'PowerState/')].code | [0]" \
              -o tsv
          }

          show_status() {
            local aks pg vm

            aks=$(aks_state) || return 1
            pg=$(pg_state) || return 1
            vm=$(vm_state) || return 1

            [[ -n "$aks" && -n "$pg" && -n "$vm" ]] || {
              echo "::error::Mindestens ein Ressourcenstatus ist leer"
              return 1
            }

            echo "=== LearningSteps Environment ==="
            echo "AKS:        $aks"
            echo "PostgreSQL: $pg"
            echo "VM:         $vm"
          }

          case "$ACTION" in
            status)
              show_status
              ;;

            start)
              echo "=== Starting PostgreSQL ==="
              PG=$(pg_state)

              if [[ "$PG" == "Stopped" ]]; then
                az postgres flexible-server start \
                  -g "$RG" -n "$POSTGRES" -o none
              elif [[ "$PG" != "Ready" ]]; then
                echo "::error::PostgreSQL in unerwartetem Zustand: $PG"
                exit 1
              fi

              [[ "$(pg_state)" == "Ready" ]] || {
                echo "::error::PostgreSQL ist nicht bereit"
                exit 1
              }

              echo "=== Starting AKS ==="
              AKS_STATE=$(aks_state)

              if [[ "$AKS_STATE" == "Stopped" ]]; then
                az aks start -g "$RG" -n "$AKS" -o none
              elif [[ "$AKS_STATE" != "Running" ]]; then
                echo "::error::AKS in unerwartetem Zustand: $AKS_STATE"
                exit 1
              fi

              [[ "$(aks_state)" == "Running" ]] || {
                echo "::error::AKS läuft nicht"
                exit 1
              }

              echo "=== Environment started ==="
              show_status
              ;;

            stop)
              echo "=== Stopping AKS ==="
              AKS_STATE=$(aks_state)

              if [[ "$AKS_STATE" == "Running" ]]; then
                az aks stop -g "$RG" -n "$AKS" -o none
              elif [[ "$AKS_STATE" != "Stopped" ]]; then
                echo "::error::AKS in unerwartetem Zustand: $AKS_STATE"
                exit 1
              fi

              [[ "$(aks_state)" == "Stopped" ]] || {
                echo "::error::AKS ist nicht gestoppt"
                exit 1
              }

              echo "=== Stopping PostgreSQL ==="
              PG=$(pg_state)

              if [[ "$PG" == "Ready" ]]; then
                az postgres flexible-server stop \
                  -g "$RG" -n "$POSTGRES" -o none
              elif [[ "$PG" != "Stopped" ]]; then
                echo "::error::PostgreSQL in unerwartetem Zustand: $PG"
                exit 1
              fi

              echo "=== Deallocating maintenance VM ==="
              VM_STATE=$(vm_state)

              if [[ "$VM_STATE" != "PowerState/deallocated" ]]; then
                az vm deallocate \
                  -g "$RG" -n "$VM" -o none
              fi

              echo "=== Environment stopped ==="
              show_status
              ;;

            *)
              echo "::error::Unbekannte Aktion: $ACTION"
              exit 1
              ;;
          esac

      - name: Verify application after start
        if: inputs.action == 'start'
        shell: bash
        env:
          APP_URL: https://learningsteps.6aff4a07cf83170001eabf87.westeurope.aksapp.io
        run: |
          set -euo pipefail

          echo "Checking HTTPS application readiness"

          ready=false

          for attempt in {1..30}; do
            if curl -fsS \
              --connect-timeout 5 \
              --max-time 10 \
              "$APP_URL/api/health/ready" \
              | jq -e '.status == "ready" and .database == "connected"' \
              >/dev/null; then
              ready=true
              break
            fi

            echo "Application not ready (attempt $attempt/30)"
            sleep 10
          done

          if [[ "$ready" != "true" ]]; then
            echo "::error::Application readiness check failed"
            exit 1
          fi

          frontend_status=$(curl -sS -o /dev/null \
            --connect-timeout 5 --max-time 15 \
            -w '%{http_code}' "$APP_URL/")

          auth_status=$(curl -sS -o /dev/null \
            --connect-timeout 5 --max-time 15 \
            -w '%{http_code}' "$APP_URL/api/entries")

          [[ "$frontend_status" == "200" ]] || {
            echo "::error::Frontend returned HTTP $frontend_status"
            exit 1
          }

          [[ "$auth_status" == "401" ]] || {
            echo "::error::Unauthenticated API returned HTTP $auth_status"
            exit 1
          }

          echo "PASS: Frontend HTTP 200"
          echo "PASS: Database readiness verified"
          echo "PASS: Authentication enforcement HTTP 401"
