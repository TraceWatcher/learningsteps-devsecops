apiVersion: v1
kind: Pod
metadata:
  name: keyvault-test
  namespace: learningsteps
  labels:
    azure.workload.identity/use: "true"

spec:
  serviceAccountName: learningsteps-api
  restartPolicy: Never

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: test
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]

      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true

      volumeMounts:
        - name: keyvault-secrets
          mountPath: /mnt/secrets
          readOnly: true

  volumes:
    - name: keyvault-secrets
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: learningsteps-keyvault
