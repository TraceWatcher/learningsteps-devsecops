apiVersion: v1
kind: Pod
metadata:
  name: learningsteps-db-recovery-client
  namespace: learningsteps
  labels:
    app: learningsteps-db-recovery-client
    azure.workload.identity/use: "true"
spec:
  serviceAccountName: learningsteps-api
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: postgres-client
      image: postgres:16-alpine
      command: ["/bin/sh", "-c", "sleep 1800"]

      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL

      env:
        - name: PGHOST
          value: psql-learningsteps-305c3ba6.postgres.database.azure.com
        - name: PGPORT
          value: "5432"
        - name: PGUSER
          value: lsadmin
        - name: PGDATABASE
          value: learning_journal
        - name: PGSSLMODE
          value: require
        - name: HOME
          value: /tmp

      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 256Mi

      volumeMounts:
        - name: keyvault-secrets
          mountPath: /mnt/secrets
          readOnly: true
        - name: postgres-tmp
          mountPath: /tmp

  volumes:
    - name: keyvault-secrets
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: learningsteps-keyvault

    - name: postgres-tmp
      emptyDir:
        sizeLimit: 64Mi
