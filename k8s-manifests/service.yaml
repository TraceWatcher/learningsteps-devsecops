
apiVersion: v1
kind: Service
metadata:
  name: learningsteps-api
  namespace: learningsteps
  labels:
    app: learningsteps-api

spec:
  type: LoadBalancer

  loadBalancerSourceRanges:
    - "80.84.218.206/32"

  selector:
    app: learningsteps-api

  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
