apiVersion: batch/v1
kind: Job
metadata:
  name: ai-smoke-test
  namespace: learningsteps
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 0
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: learningsteps-api
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-test
          image: python:3.12-slim
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          env:
            - name: AZURE_OPENAI_ENDPOINT
              value: "https://oai-learningsteps-305c3ba6.openai.azure.com/"
            - name: AZURE_OPENAI_DEPLOYMENT
              value: "learningsteps-summary"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONPATH
              value: /tmp/python-packages
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp/.cache
          command:
            - /bin/sh
            - -c
            - |
              set -e

              pip install --quiet --no-cache-dir \
                --target /tmp/python-packages \
                -r /requirements/requirements.txt

              python - <<'PY'
              import os
              from openai import OpenAI
              from azure.identity import (
                  DefaultAzureCredential,
                  get_bearer_token_provider,
              )

              credential = DefaultAzureCredential(
                  exclude_interactive_browser_credential=True
              )

              token_provider = get_bearer_token_provider(
                  credential,
                  "https://cognitiveservices.azure.com/.default",
              )

              endpoint = os.environ["AZURE_OPENAI_ENDPOINT"]

              client = OpenAI(
                  base_url=endpoint.rstrip("/") + "/openai/v1/",
                  api_key=token_provider,
                  timeout=30.0,
              )

              response = client.chat.completions.create(
                  model=os.environ["AZURE_OPENAI_DEPLOYMENT"],
                  messages=[
                      {
                          "role": "system",
                          "content": "Antworte kurz auf Deutsch.",
                      },
                      {
                          "role": "user",
                          "content": (
                              "Fasse zusammen: Ich habe Terraform "
                              "und Kubernetes gelernt und eine "
                              "CI/CD-Pipeline aufgebaut."
                          ),
                      },
                  ],
                  max_completion_tokens=120,
              )

              print("AI RESPONSE:")
              print(response.choices[0].message.content)
              print("MODEL CALL SUCCESSFUL")
              PY
          volumeMounts:
            - name: ai-tmp
              mountPath: /tmp
            - name: ai-requirements
              mountPath: /requirements
              readOnly: true
      volumes:
        - name: ai-tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: ai-requirements
          configMap:
            name: ai-test-requirements
